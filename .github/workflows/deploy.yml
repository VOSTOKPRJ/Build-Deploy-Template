name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest .dll from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ${{ github.repository }} \
            --pattern '*.dll' \
            --dir ./out

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
    
      - name: Deploy via SCP
        run: |
         scp -O -P 22 -o StrictHostKeyChecking=no out/*.dll "scpsl"@"213.171.17.24":"/home/scpsl/.config/EXILED7777/Plugins/"
