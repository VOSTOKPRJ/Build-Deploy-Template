name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Укажите версию релиза (например, 1.0.0)'
        required: true
        type: string
        
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag_name: ${{ inputs.tag_name }}
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
