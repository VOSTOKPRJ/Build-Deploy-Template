name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Укажите версию релиза (например, 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      # ИЗМЕНИТЬ: путь к .csproj файлу своего плагина
      run: msbuild YOUR_PROJECT_NAME/YOUR_PROJECT_NAME.csproj /p:Configuration=Release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name }}
        # ИЗМЕНИТЬ: путь к собранному .dll своего плагина
        files: YOUR_PROJECT_NAME/bin/Release/YOUR_PROJECT_NAME.dll
        name:
        body:
        draft: false
        prerelease: false
